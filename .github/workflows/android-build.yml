name: Build Android Binary

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: Build for Android (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/bin/aarch64-linux-android21-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android21-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB_aarch64_linux_android="$TOOLCHAIN/bin/llvm-ranlib"

          cargo build --release --bin mediaflow-proxy-light \
            --target aarch64-linux-android \
            --no-default-features \
            --features "hls,mpd,drm,xtream,extractors,web-ui,base64-url,acestream,tls-rustls"

      - name: Build for Android (armeabi-v7a)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$TOOLCHAIN/bin/armv7a-linux-androideabi21-clang"
          export CC_armv7_linux_androideabi="$TOOLCHAIN/bin/armv7a-linux-androideabi21-clang"
          export AR_armv7_linux_androideabi="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB_armv7_linux_androideabi="$TOOLCHAIN/bin/llvm-ranlib"

          cargo build --release --bin mediaflow-proxy-light \
            --target armv7-linux-androideabi \
            --no-default-features \
            --features "hls,mpd,drm,xtream,extractors,web-ui,base64-url,acestream,tls-rustls"

      - name: Build for Android (x86_64)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TOOLCHAIN/bin/x86_64-linux-android21-clang"
          export CC_x86_64_linux_android="$TOOLCHAIN/bin/x86_64-linux-android21-clang"
          export AR_x86_64_linux_android="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB_x86_64_linux_android="$TOOLCHAIN/bin/llvm-ranlib"

          cargo build --release --bin mediaflow-proxy-light \
            --target x86_64-linux-android \
            --no-default-features \
            --features "hls,mpd,drm,xtream,extractors,web-ui,base64-url,acestream,tls-rustls"

      - name: Rename binaries
        run: |
          mkdir -p android-binaries/arm64-v8a
          mkdir -p android-binaries/armeabi-v7a
          mkdir -p android-binaries/x86_64

          BIN_ARM64="target/aarch64-linux-android/release/mediaflow-proxy-light"
          if [ ! -f "$BIN_ARM64" ]; then
            echo "❌ No se encontró el binario para arm64"
            ls -la target/aarch64-linux-android/release/
            exit 1
          fi
          cp "$BIN_ARM64" android-binaries/arm64-v8a/libmediaflow-proxy-arm64.so
          chmod +x android-binaries/arm64-v8a/libmediaflow-proxy-arm64.so

          BIN_V7="target/armv7-linux-androideabi/release/mediaflow-proxy-light"
          if [ -f "$BIN_V7" ]; then
            cp "$BIN_V7" android-binaries/armeabi-v7a/libmediaflow-proxy-arm32.so
            chmod +x android-binaries/armeabi-v7a/libmediaflow-proxy-arm32.so
          fi

          BIN_X64="target/x86_64-linux-android/release/mediaflow-proxy-light"
          if [ -f "$BIN_X64" ]; then
            cp "$BIN_X64" android-binaries/x86_64/libmediaflow-proxy-x86_64.so
            chmod +x android-binaries/x86_64/libmediaflow-proxy-x86_64.so
          fi

          ls -la android-binaries/*/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mediaflow-android-binaries
          path: android-binaries/
          retention-days: 30
