name: Build iOS XCFramework

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      
      - name: Configure iOS toolchain
        run: |
          SDK_IOS=$(xcrun --sdk iphoneos --show-sdk-path)
          CC_IOS=$(xcrun --sdk iphoneos --find clang)
          AR_IOS=$(xcrun --sdk iphoneos --find ar)
          SDK_SIM=$(xcrun --sdk iphonesimulator --show-sdk-path)
          CC_SIM=$(xcrun --sdk iphonesimulator --find clang)
          AR_SIM=$(xcrun --sdk iphonesimulator --find ar)

          echo "CARGO_TARGET_AARCH64_APPLE_IOS_LINKER=$CC_IOS" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_APPLE_IOS_AR=$AR_IOS" >> $GITHUB_ENV
          echo "CFLAGS_aarch64_apple_ios=-isysroot $SDK_IOS -target arm64-apple-ios" >> $GITHUB_ENV

          echo "CARGO_TARGET_AARCH64_APPLE_IOS_SIM_LINKER=$CC_SIM" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_APPLE_IOS_SIM_AR=$AR_SIM" >> $GITHUB_ENV
          echo "CFLAGS_aarch64_apple_ios_sim=-isysroot $SDK_SIM -target arm64-apple-ios-simulator" >> $GITHUB_ENV

          echo "CARGO_TARGET_X86_64_APPLE_IOS_LINKER=$CC_SIM" >> $GITHUB_ENV
          echo "CARGO_TARGET_X86_64_APPLE_IOS_AR=$AR_SIM" >> $GITHUB_ENV
          echo "CFLAGS_x86_64_apple_ios=-isysroot $SDK_SIM -target x86_64-apple-ios-simulator" >> $GITHUB_ENV
      
      # 🆕 STEP NUEVO: Wrappers para clang/ar de iOS
      - name: Install iOS compiler wrappers
        run: |
          # Device (arm64)
          cat > /tmp/cc_aarch64_apple_ios <<'EOF'
          #!/bin/bash
          exec xcrun --sdk iphoneos clang -target arm64-apple-ios -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" "$@"
          EOF
          chmod +x /tmp/cc_aarch64_apple_ios

          cat > /tmp/ar_aarch64_apple_ios <<'EOF'
          #!/bin/bash
          exec xcrun --sdk iphoneos ar "$@"
          EOF
          chmod +x /tmp/ar_aarch64_apple_ios

          # Simulator arm64
          cat > /tmp/cc_aarch64_apple_ios_sim <<'EOF'
          #!/bin/bash
          exec xcrun --sdk iphonesimulator clang -target arm64-apple-ios-simulator -isysroot "$(xcrun --sdk iphonesimulator --show-sdk-path)" "$@"
          EOF
          chmod +x /tmp/cc_aarch64_apple_ios_sim

          cat > /tmp/ar_aarch64_apple_ios_sim <<'EOF'
          #!/bin/bash
          exec xcrun --sdk iphonesimulator ar "$@"
          EOF
          chmod +x /tmp/ar_aarch64_apple_ios_sim

          # Simulator x86_64
          cat > /tmp/cc_x86_64_apple_ios <<'EOF'
          #!/bin/bash
          exec xcrun --sdk iphonesimulator clang -target x86_64-apple-ios-simulator -isysroot "$(xcrun --sdk iphonesimulator --show-sdk-path)" "$@"
          EOF
          chmod +x /tmp/cc_x86_64_apple_ios

          cat > /tmp/ar_x86_64_apple_ios <<'EOF'
          #!/bin/bash
          exec xcrun --sdk iphonesimulator ar "$@"
          EOF
          chmod +x /tmp/ar_x86_64_apple_ios

          # Exportar para siguientes steps
          echo "CC_aarch64_apple_ios=/tmp/cc_aarch64_apple_ios" >> $GITHUB_ENV
          echo "AR_aarch64_apple_ios=/tmp/ar_aarch64_apple_ios" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_APPLE_IOS_LINKER=/tmp/cc_aarch64_apple_ios" >> $GITHUB_ENV

          echo "CC_aarch64_apple_ios_sim=/tmp/cc_aarch64_apple_ios_sim" >> $GITHUB_ENV
          echo "AR_aarch64_apple_ios_sim=/tmp/ar_aarch64_apple_ios_sim" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_APPLE_IOS_SIM_LINKER=/tmp/cc_aarch64_apple_ios_sim" >> $GITHUB_ENV

          echo "CC_x86_64_apple_ios=/tmp/cc_x86_64_apple_ios" >> $GITHUB_ENV
          echo "AR_x86_64_apple_ios=/tmp/ar_x86_64_apple_ios" >> $GITHUB_ENV
          echo "CARGO_TARGET_X86_64_APPLE_IOS_LINKER=/tmp/cc_x86_64_apple_ios" >> $GITHUB_ENV
      
      - name: Build for iOS device (arm64)
        run: |
          cargo build --release \
            --target aarch64-apple-ios \
            --no-default-features \
            --features "hls,mpd,drm,xtream,extractors,base64-url,tls-rustls,ffi"
      
      - name: Build for iOS simulator (arm64)
        run: |
          cargo build --release \
            --target aarch64-apple-ios-sim \
            --no-default-features \
            --features "hls,mpd,drm,xtream,extractors,base64-url,tls-rustls,ffi"
      
      - name: Build for iOS simulator (x86_64)
        run: |
          cargo build --release \
            --target x86_64-apple-ios \
            --no-default-features \
            --features "hls,mpd,drm,xtream,extractors,base64-url,tls-rustls,ffi"
      
      - name: Create XCFramework
        run: |
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libmediaflow_proxy_light.a \
            -library target/aarch64-apple-ios-sim/release/libmediaflow_proxy_light.a \
            -library target/x86_64-apple-ios/release/libmediaflow_proxy_light.a \
            -output MediaFlowProxyLight.xcframework
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaFlowProxyLight.xcframework
          path: MediaFlowProxyLight.xcframework
          retention-days: 30
